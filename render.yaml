# render.yaml — Wriven backend Blueprint for Render.
#
# Connect this repo on Render (Dashboard → New → Blueprint) and Render syncs all
# three services from this file. On every push it rebuilds what changed.
#
# SECRETS: every `sync: false` key is prompted once in the Render dashboard. Never
# put secret values here and never commit them — this file is safe to commit.
#
# Topology:
#   wriven-gateway  → web service  (public HTTP, port from Render $PORT) → api.wriven.tech
#   wriven-auth     → pserv         (internal NestJS TCP :5001)
#   wriven-core     → pserv         (internal NestJS TCP :5002)
#   wriven-ai       → pserv         (internal FastAPI HTTP :8000)
# core-service → ai-service is the only NestJS↔non-NestJS hop (HTTP); all
# NestJS↔NestJS is TCP.
# Database: external Supabase (no Render DB). No Redis — services are brokerless TCP.

services:
  # ── auth-service (internal TCP microservice) ─────────────────────────────────
  - type: pserv
    name: wriven-auth
    runtime: docker
    dockerfilePath: ./apps/auth-service/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "5001"
      - key: HOST
        value: "0.0.0.0"
      - fromGroup: wriven-shared
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # Stripe — auth-service owns billing and builds the Stripe client at boot.
      # The provider THROWS if STRIPE_SECRET_KEY is unset, so this is required
      # even if billing is unused yet (a test-mode sk_test_… key works).
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Admin JWT comes from the wriven-shared group (auth SIGNS admin tokens,
      # the gateway verifies them — one shared value keeps them in lockstep).
      # Frontend links — invitation emails (CLIENT_ORIGIN), password-reset +
      # verify-email links + billing redirects (APP_URL).
      - key: CLIENT_ORIGIN
        value: https://wriven.tech
      - key: APP_URL
        value: https://wriven.tech
      # R2 public base for avatar URL reconstruction — same value as core's
      # R2_PUBLIC_URL. If unset, avatars render as broken /avatars/… paths.
      - key: R2_PUBLIC_URL
        sync: false

  # ── core-service (internal TCP microservice) ─────────────────────────────────
  - type: pserv
    name: wriven-core
    runtime: docker
    dockerfilePath: ./apps/core-service/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "5002"
      - key: HOST
        value: "0.0.0.0"
      - fromGroup: wriven-shared
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      # ai-service (internal HTTP :8000). INTERNAL_SECRET authenticates the hop.
      - key: AI_SERVICE_URL
        value: http://wriven-ai:8000
      # Slightly longer than ai-service's provider timeout so a provider timeout
      # can be returned to core instead of looking like a disconnected request.
      - key: AI_SERVICE_TIMEOUT_MS
        value: "35000"
      - key: AI_AUDIT_RETENTION_DAYS
        value: "30"
      # Optional configured-model provider prices in micro-USD / 1M tokens.
      # Set both values for cost reconciliation; omit both if pricing is unknown.
      - key: AI_INPUT_COST_MICROUSD_PER_MILLION_TOKENS
        sync: false
      - key: AI_OUTPUT_COST_MICROUSD_PER_MILLION_TOKENS
        sync: false
      - key: INTERNAL_SECRET
        sync: false
      # auth-service TCP target — core's entitlements (AI/entries/media/webhooks
      # quota enforcement) call auth to check limits. Without these, core
      # defaults to localhost:5001 (its OWN container) and quotas silently
      # fail open.
      - key: AUTH_SERVICE_HOST
        value: wriven-auth
      - key: AUTH_SERVICE_PORT
        value: "5001"

  # ── ai-service (internal HTTP microservice, FastAPI) ──────────────────────────
  - type: pserv
    name: wriven-ai
    runtime: docker
    dockerfilePath: ./apps/ai-service/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "8000"
      - key: ENVIRONMENT
        value: production
      # Shared secret authenticating the core-service → ai-service HTTP hop.
      - key: INTERNAL_SECRET
        sync: false
      # LLM provider (generic OpenAI-compatible Chat Completions). The provider
      # key lives ONLY here — never on gateway/core/client or in the browser.
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_TIMEOUT_MS
        value: "30000"
      - key: AI_MAX_INPUT_CHARS
        value: "24000"
      - key: AI_MAX_OUTPUT_TOKENS
        value: "8000"
      # Optional JSON of extra provider headers (e.g. OpenRouter attribution).
      - key: AI_HEADERS
        sync: false

  # ── api-gateway (public HTTP) ─────────────────────────────────────────────────
  - type: web
    name: wriven-gateway
    runtime: docker
    dockerfilePath: ./apps/api-gateway/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /v1/health
    autoDeployTrigger: commit
    domains:
      - api.wriven.tech
    envVars:
      - fromGroup: wriven-shared
      # Internal TCP hosts of the private services. Default to the service names
      # (Render routes pserv traffic by name). If a name does not resolve, copy the
      # exact internal hostname from each pserv's "Connect" tab and paste it here.
      - key: AUTH_SERVICE_HOST
        value: wriven-auth
      - key: AUTH_SERVICE_PORT
        value: "5001"
      - key: CORE_SERVICE_HOST
        value: wriven-core
      - key: CORE_SERVICE_PORT
        value: "5002"
      # ai-service location — used ONLY by /v1/health's ping; actual AI traffic
      # is core→ai (core has its own AI_SERVICE_URL). ai /health is unauthenticated.
      - key: AI_SERVICE_URL
        value: http://wriven-ai:8000
      # Structured request logging level (pino). info = one JSON line per request
      # (health checks excluded). Raise to warn to quiet request lines.
      - key: LOG_LEVEL
        value: info
      # Google OAuth — the passport strategy lives on the gateway. Redirect URI
      # must match the Google Cloud console exactly (see doc/deployment.md).
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://api.wriven.tech/v1/auth/google/callback
      # SPA origin for the OAuth post-login redirect (falls back to localhost).
      - key: CLIENT_ORIGIN
        value: https://wriven.tech
      # CORS allowlist — exact origins, credentials enabled (never `*`).
      # Client (apex + www) + the admin SPA subdomain.
      - key: CORS_ORIGINS
        value: https://wriven.tech,https://www.wriven.tech,https://admin.wriven.tech,https://www.admin.wriven.tech
      - key: USAGE_ENFORCE
        value: "false"

# ── Shared environment group (attached to the three NestJS services; the FastAPI
# ai-service reads none of these and is intentionally excluded) ─────────────────
envVarGroups:
  - name: wriven-shared
    envVars:
      - key: DATABASE_URL          # Supabase pooled (Transaction mode, port 6543, ?pgbouncer=true)
        sync: false
      - key: DIRECT_URL            # Supabase direct (Session mode, port 5432) — for migrations
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Admin JWT — shared so the gateway (verifies) and auth-service (signs)
      # always agree on one value with a single prompt.
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
