# render.yaml — Wriven backend Blueprint for Render.
#
# Connect this repo on Render (Dashboard → New → Blueprint) and Render syncs all
# three services from this file. On every push it rebuilds what changed.
#
# SECRETS: every `sync: false` key is prompted once in the Render dashboard. Never
# put secret values here and never commit them — this file is safe to commit.
#
# Topology:
#   wriven-gateway  → web service  (public HTTP, port from Render $PORT) → api.wriven.tech
#   wriven-auth     → pserv         (internal NestJS TCP :5001)
#   wriven-core     → pserv         (internal NestJS TCP :5002)
#   wriven-ai       → pserv         (internal FastAPI HTTP :8000)
# core-service → ai-service is the only NestJS↔non-NestJS hop (HTTP); all
# NestJS↔NestJS is TCP.
# Database: external Supabase (no Render DB). No Redis — services are brokerless TCP.

services:
  # ── auth-service (internal TCP microservice) ─────────────────────────────────
  - type: pserv
    name: wriven-auth
    runtime: docker
    dockerfilePath: ./apps/auth-service/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "5001"
      - key: HOST
        value: "0.0.0.0"
      - fromGroup: wriven-shared
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASS
        sync: false
      - key: MAIL_FROM
        sync: false

  # ── core-service (internal TCP microservice) ─────────────────────────────────
  - type: pserv
    name: wriven-core
    runtime: docker
    dockerfilePath: ./apps/core-service/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "5002"
      - key: HOST
        value: "0.0.0.0"
      - fromGroup: wriven-shared
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      # ai-service (internal HTTP :8000). INTERNAL_SECRET authenticates the hop.
      - key: AI_SERVICE_URL
        value: http://wriven-ai:8000
      # Slightly longer than ai-service's provider timeout so a provider timeout
      # can be returned to core instead of looking like a disconnected request.
      - key: AI_SERVICE_TIMEOUT_MS
        value: "35000"
      - key: AI_AUDIT_RETENTION_DAYS
        value: "30"
      # Optional configured-model provider prices in micro-USD / 1M tokens.
      # Set both values for cost reconciliation; omit both if pricing is unknown.
      - key: AI_INPUT_COST_MICROUSD_PER_MILLION_TOKENS
        sync: false
      - key: AI_OUTPUT_COST_MICROUSD_PER_MILLION_TOKENS
        sync: false
      - key: INTERNAL_SECRET
        sync: false

  # ── ai-service (internal HTTP microservice, FastAPI) ──────────────────────────
  - type: pserv
    name: wriven-ai
    runtime: docker
    dockerfilePath: ./apps/ai-service/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "8000"
      - key: ENVIRONMENT
        value: production
      # Shared secret authenticating the core-service → ai-service HTTP hop.
      - key: INTERNAL_SECRET
        sync: false
      # LLM provider (generic OpenAI-compatible Chat Completions). The provider
      # key lives ONLY here — never on gateway/core/client or in the browser.
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_TIMEOUT_MS
        value: "30000"
      - key: AI_MAX_INPUT_CHARS
        value: "24000"
      - key: AI_MAX_OUTPUT_TOKENS
        value: "1200"
      # Optional JSON of extra provider headers (e.g. OpenRouter attribution).
      - key: AI_HEADERS
        sync: false

  # ── api-gateway (public HTTP) ─────────────────────────────────────────────────
  - type: web
    name: wriven-gateway
    runtime: docker
    dockerfilePath: ./apps/api-gateway/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    domains:
      - api.wriven.tech
    envVars:
      - fromGroup: wriven-shared
      - key: ADMIN_JWT_SECRET
        sync: false
      # Internal TCP hosts of the private services. Default to the service names
      # (Render routes pserv traffic by name). If a name does not resolve, copy the
      # exact internal hostname from each pserv's "Connect" tab and paste it here.
      - key: AUTH_SERVICE_HOST
        value: wriven-auth
      - key: AUTH_SERVICE_PORT
        value: "5001"
      - key: CORE_SERVICE_HOST
        value: wriven-core
      - key: CORE_SERVICE_PORT
        value: "5002"
      - key: FRONTEND_URL
        value: https://wriven.tech
      - key: USAGE_ENFORCE
        value: "false"

# ── Shared environment group (attached to all three services) ───────────────────
envVarGroups:
  - name: wriven-shared
    envVars:
      - key: DATABASE_URL          # Supabase pooled (Transaction mode, port 6543, ?pgbouncer=true)
        sync: false
      - key: DIRECT_URL            # Supabase direct (Session mode, port 5432) — for migrations
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REFRESH_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: NODE_ENV
        value: production
