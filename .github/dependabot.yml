version: 2
updates:
  # Single npm entry — pnpm uses one root lockfile for the whole monorepo.
  # All minor/patch bumps bundled into ONE monthly PR; major bumps ignored
  # (do those manually when you choose). Security alerts are separate (repo setting).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - update-types: [major]
    commit-message:
      prefix: chore
      include: scope

  # Keep GitHub Actions current — one monthly PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope
