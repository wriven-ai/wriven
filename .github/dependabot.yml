version: 2
updates:
  # Single npm entry — pnpm uses one root lockfile for the whole monorepo.
  # `directories` (plural) + group-by: dependency-name is what actually merges
  # the same dependency across apps/core-service, apps/auth-service, etc. into
  # ONE PR instead of one per app — directory: / alone doesn't do this.
  - package-ecosystem: npm
    directories:
      - '/'
      - '/apps/*'
      - '/libs/*'
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      minor-and-patch:
        group-by: dependency-name
        update-types:
          - minor
          - patch
    ignore:
      - update-types: [major]
    commit-message:
      prefix: chore
      include: scope

  # Keep GitHub Actions current — one monthly PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope
