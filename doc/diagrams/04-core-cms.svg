<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 920" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5eead4"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect width="1240" height="920" fill="#0b1120"/>

  <text x="620" y="34" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="bold">Core-Service — Headless CMS</text>
  <text x="620" y="56" text-anchor="middle" fill="#94a3b8" font-size="12">content model · entry lifecycle · delivery API · media (core_svc, project-scoped, trusts the gateway)</text>

  <!-- ===== CONTENT MODEL ===== -->
  <text x="40" y="92" fill="#5eead4" font-size="12" font-weight="bold">CONTENT MODEL</text>
  <g><rect x="30" y="100" width="240" height="150" rx="10" fill="#0f2a2a" stroke="#14b8a6" stroke-width="2"/>
    <text x="150" y="124" text-anchor="middle" fill="#5eead4" font-size="11" font-weight="bold">content_types</text>
    <line x1="40" y1="132" x2="260" y2="132" stroke="#334155"/>
    <text x="44" y="150" fill="#e2e8f0" font-size="10">id · name · apiId</text>
    <text x="44" y="168" fill="#fcd34d" font-size="10">fields  json (FieldDef[])</text>
    <text x="44" y="190" fill="#94a3b8" font-size="9">8 types: text · richtext · number</text>
    <text x="44" y="206" fill="#94a3b8" font-size="9">· boolean · date · media · select</text>
    <text x="44" y="222" fill="#94a3b8" font-size="9">· reference (unique/multiple)</text>
    <text x="44" y="240" fill="#64748b" font-size="9">soft-deleted; seeds a Post type</text></g>

  <g><rect x="320" y="100" width="240" height="150" rx="10" fill="#0f2a2a" stroke="#14b8a6" stroke-width="2"/>
    <text x="440" y="124" text-anchor="middle" fill="#5eead4" font-size="11" font-weight="bold">content_entries</text>
    <line x1="330" y1="132" x2="550" y2="132" stroke="#334155"/>
    <text x="324" y="150" fill="#fcd34d" font-size="10">contentTypeId  FK</text>
    <text x="324" y="168" fill="#e2e8f0" font-size="10">slug · status · data (JSONB)</text>
    <text x="324" y="186" fill="#94a3b8" font-size="9">data validated against fields</text>
    <text x="324" y="202" fill="#94a3b8" font-size="9">(type, required, unique)</text>
    <text x="324" y="222" fill="#94a3b8" font-size="9">authorId · publishedAt</text>
    <text x="324" y="240" fill="#64748b" font-size="9">unique-field enforced server-side</text></g>

  <g><rect x="610" y="100" width="220" height="120" rx="10" fill="#0f2a2a" stroke="#14b8a6" stroke-width="2"/>
    <text x="720" y="124" text-anchor="middle" fill="#5eead4" font-size="11" font-weight="bold">revisions</text>
    <line x1="620" y1="132" x2="820" y2="132" stroke="#334155"/>
    <text x="614" y="150" fill="#fcd34d" font-size="10">entryId  FK</text>
    <text x="614" y="168" fill="#e2e8f0" font-size="10">version · data · status</text>
    <text x="614" y="186" fill="#94a3b8" font-size="9">one per write</text>
    <text x="614" y="204" fill="#94a3b8" font-size="9">restore = new revision</text></g>

  <line x1="270" y1="175" x2="318" y2="175" stroke="#5eead4" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="294" y="168" text-anchor="middle" fill="#5eead4" font-size="9">1:M</text>
  <line x1="560" y1="160" x2="608" y2="150" stroke="#5eead4" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="584" y="146" text-anchor="middle" fill="#5eead4" font-size="9">1:M</text>

  <!-- ===== ENTRY LIFECYCLE ===== -->
  <text x="40" y="292" fill="#5eead4" font-size="12" font-weight="bold">ENTRY LIFECYCLE</text>
  <g><rect x="60" y="310" width="140" height="70" rx="30" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
    <text x="130" y="340" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="bold">draft</text>
    <text x="130" y="360" text-anchor="middle" fill="#64748b" font-size="9">create / save / unpublish</text></g>
  <g><rect x="300" y="310" width="140" height="70" rx="30" fill="#062b1a" stroke="#34d399" stroke-width="2"/>
    <text x="370" y="340" text-anchor="middle" fill="#34d399" font-size="11" font-weight="bold">published</text>
    <text x="370" y="360" text-anchor="middle" fill="#64748b" font-size="9">visible to Delivery API</text></g>
  <g><rect x="540" y="310" width="140" height="70" rx="30" fill="#2a2008" stroke="#f59e0b" stroke-width="2"/>
    <text x="610" y="340" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="bold">archived</text>
    <text x="610" y="360" text-anchor="middle" fill="#64748b" font-size="9">hidden, restorable</text></g>
  <g><rect x="780" y="310" width="120" height="70" rx="30" fill="#2a0f1a" stroke="#f43f5e" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="840" y="340" text-anchor="middle" fill="#fda4af" font-size="11" font-weight="bold">deleted</text>
    <text x="840" y="360" text-anchor="middle" fill="#64748b" font-size="9">soft (content type)</text></g>

  <line x1="200" y1="345" x2="298" y2="345" stroke="#34d399" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="249" y="338" text-anchor="middle" fill="#34d399" font-size="9">publish</text>
  <line x1="300" y1="358" x2="202" y2="358" stroke="#475569" stroke-width="1.4" marker-end="url(#ab)"/>
  <text x="249" y="372" text-anchor="middle" fill="#94a3b8" font-size="9">unpublish</text>
  <line x1="440" y1="345" x2="538" y2="345" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="489" y="338" text-anchor="middle" fill="#fcd34d" font-size="9">archive</text>
  <line x1="540" y1="358" x2="442" y2="358" stroke="#475569" stroke-width="1.4" marker-end="url(#ab)"/>
  <text x="489" y="372" text-anchor="middle" fill="#94a3b8" font-size="9">restore→publish</text>

  <text x="130" y="410" text-anchor="middle" fill="#64748b" font-size="9">each transition writes a revision</text>
  <text x="370" y="410" text-anchor="middle" fill="#fda4af" font-size="9">publish → CDN tag purge + webhook fire</text>

  <!-- ===== DELIVERY API ===== -->
  <text x="40" y="452" fill="#5eead4" font-size="12" font-weight="bold">DELIVERY API (public reads · api-key auth)</text>
  <g><rect x="30" y="465" width="150" height="60" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
    <text x="105" y="490" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="bold">consumer</text>
    <text x="105" y="508" text-anchor="middle" fill="#64748b" font-size="9">SDK / fetch</text></g>

  <g><rect x="220" y="455" width="180" height="80" rx="8" fill="#0c1a33" stroke="#3b82f6" stroke-width="2"/>
    <text x="310" y="478" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="bold">api-gateway</text>
    <text x="310" y="496" text-anchor="middle" fill="#94a3b8" font-size="9">ApiKeyGuard</text>
    <text x="310" y="512" text-anchor="middle" fill="#fcd34d" font-size="9">Bearer wrk_… → project scope</text>
    <text x="310" y="526" text-anchor="middle" fill="#94a3b8" font-size="9">read / preview / manage</text></g>

  <g><rect x="440" y="455" width="170" height="80" rx="8" fill="#0f1f1c" stroke="#14b8a6" stroke-width="2"/>
    <text x="525" y="478" text-anchor="middle" fill="#5eead4" font-size="10" font-weight="bold">core-service</text>
    <text x="525" y="496" text-anchor="middle" fill="#94a3b8" font-size="9">published-only reads</text>
    <text x="525" y="512" text-anchor="middle" fill="#94a3b8" font-size="9">(preview key → drafts)</text>
    <text x="525" y="528" text-anchor="middle" fill="#64748b" font-size="9">by apiId / slug</text></g>

  <g><rect x="650" y="455" width="180" height="80" rx="8" fill="#0f1f1c" stroke="#14b8a6" stroke-width="2"/>
    <text x="740" y="478" text-anchor="middle" fill="#5eead4" font-size="10" font-weight="bold">hydrate response</text>
    <text x="740" y="496" text-anchor="middle" fill="#94a3b8" font-size="9">select/filter/sort/page</text>
    <text x="740" y="512" text-anchor="middle" fill="#94a3b8" font-size="9">include (ref expand 0–3)</text>
    <text x="740" y="528" text-anchor="middle" fill="#fcd34d" font-size="9">media fields → public URLs</text></g>

  <g><rect x="870" y="465" width="150" height="60" rx="8" fill="#1a0c14" stroke="#f43f5e" stroke-width="2"/>
    <text x="945" y="490" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="bold">Cloudflare CDN</text>
    <text x="945" y="508" text-anchor="middle" fill="#64748b" font-size="9">s-maxage + Cache-Tag</text></g>

  <line x1="180" y1="495" x2="218" y2="495" stroke="#475569" stroke-width="1.6" marker-end="url(#ab)"/>
  <text x="199" y="488" text-anchor="middle" fill="#5eead4" font-size="9">HTTP</text>
  <line x1="400" y1="495" x2="438" y2="495" stroke="#475569" stroke-width="1.6" marker-end="url(#ab)"/>
  <text x="419" y="488" text-anchor="middle" fill="#5eead4" font-size="9">TCP</text>
  <line x1="610" y1="495" x2="648" y2="495" stroke="#5eead4" stroke-width="1.6"/>
  <line x1="830" y1="495" x2="868" y2="495" stroke="#475569" stroke-width="1.6" marker-end="url(#ab)"/>

  <!-- ===== MEDIA ===== -->
  <text x="40" y="572" fill="#5eead4" font-size="12" font-weight="bold">MEDIA (R2 · keys-only)</text>
  <g><rect x="30" y="585" width="120" height="56" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
    <text x="90" y="608" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="bold">dashboard</text>
    <text x="90" y="626" text-anchor="middle" fill="#64748b" font-size="9">upload</text></g>
  <g><rect x="180" y="585" width="150" height="56" rx="8" fill="#0c1a33" stroke="#3b82f6" stroke-width="2"/>
    <text x="255" y="608" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="bold">gateway presign</text>
    <text x="255" y="626" text-anchor="middle" fill="#64748b" font-size="9">+ quota check</text></g>
  <g><rect x="360" y="585" width="130" height="56" rx="8" fill="#1f1604" stroke="#f59e0b" stroke-width="2"/>
    <text x="425" y="608" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="bold">R2 PUT</text>
    <text x="425" y="626" text-anchor="middle" fill="#64748b" font-size="9">direct (bytes)</text></g>
  <g><rect x="520" y="585" width="170" height="56" rx="8" fill="#0f1f1c" stroke="#14b8a6" stroke-width="2"/>
    <text x="605" y="608" text-anchor="middle" fill="#5eead4" font-size="10" font-weight="bold">media_assets row</text>
    <text x="605" y="626" text-anchor="middle" fill="#fcd34d" font-size="9">stores KEY only (no URL)</text></g>
  <g><rect x="720" y="585" width="150" height="56" rx="8" fill="#0f1f1c" stroke="#14b8a6" stroke-width="2"/>
    <text x="795" y="608" text-anchor="middle" fill="#5eead4" font-size="10" font-weight="bold">delivery</text>
    <text x="795" y="626" text-anchor="middle" fill="#94a3b8" font-size="9">key → public URL</text></g>

  <line x1="150" y1="613" x2="178" y2="613" stroke="#475569" stroke-width="1.4" marker-end="url(#ab)"/>
  <line x1="330" y1="613" x2="358" y2="613" stroke="#475569" stroke-width="1.4" marker-end="url(#ab)"/>
  <text x="344" y="606" text-anchor="middle" fill="#94a3b8" font-size="9">PUT</text>
  <line x1="490" y1="613" x2="518" y2="613" stroke="#475569" stroke-width="1.4" marker-end="url(#ab)"/>
  <text x="504" y="606" text-anchor="middle" fill="#94a3b8" font-size="9">key</text>
  <line x1="690" y1="613" x2="718" y2="613" stroke="#5eead4" stroke-width="1.4" marker-end="url(#a)"/>

  <text x="425" y="664" text-anchor="middle" fill="#64748b" font-size="9">DB never stores a full URL; runtime reconstructs from the key. Per-workspace quota (100 MB) + per-file caps (5/25 MB) enforced at presign.</text>

  <!-- footer -->
  <g><rect x="30" y="690" width="1180" height="110" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="50" y="714" fill="#94a3b8" font-size="11" font-weight="bold">RULES ENCODED</text>
    <text x="50" y="736" fill="#e2e8f0" font-size="10">• core-service trusts the gateway — no authZ here. RBAC for CMS routes is enforced in the gateway PermissionGuard (see 01-auth-rbac).</text>
    <text x="50" y="756" fill="#e2e8f0" font-size="10">• Publish side-effects: CDN tag-purge (Cloudflare) + webhook fan-out (entry.published / .unpublished / .deleted).</text>
    <text x="50" y="776" fill="#e2e8f0" font-size="10">• Delivery API auth = API key (wrk_read_ / wrk_preview_ / wrk_admin_), NOT a user JWT. Scope drives preview→drafts access.</text>
    <text x="50" y="796" fill="#e2e8f0" font-size="10">• Reference fields expand via include; media fields always hydrate to public URL objects.</text>
  </g>

  <text x="620" y="838" text-anchor="middle" fill="#64748b" font-size="10">Image transforms (resize/format) deferred — consumer optimizes via next/image. Adapter-ready.</text>
</svg>
