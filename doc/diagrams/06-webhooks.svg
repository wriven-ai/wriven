<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f43f5e"/></marker>
  </defs>
  <rect width="1240" height="660" fill="#0b1120"/>

  <text x="620" y="34" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="bold">Webhooks — Signed Dispatch</text>
  <text x="620" y="56" text-anchor="middle" fill="#94a3b8" font-size="12">core_svc fires on entry events · HMAC-signed POST · retry/backoff · per-webhook secret (shown once)</text>

  <!-- trigger -->
  <g><rect x="30" y="110" width="170" height="90" rx="8" fill="#0f2a2a" stroke="#14b8a6" stroke-width="2"/>
    <text x="115" y="134" text-anchor="middle" fill="#5eead4" font-size="10" font-weight="bold">entry event</text>
    <text x="40" y="156" fill="#fcd34d" font-size="10">entry.published</text>
    <text x="40" y="174" fill="#fcd34d" font-size="10">entry.unpublished</text>
    <text x="40" y="192" fill="#fcd34d" font-size="10">entry.deleted</text></g>

  <!-- dispatcher -->
  <g><rect x="250" y="100" width="210" height="110" rx="8" fill="#0f1f1c" stroke="#14b8a6" stroke-width="2"/>
    <text x="355" y="124" text-anchor="middle" fill="#5eead4" font-size="10" font-weight="bold">WebhookDispatcher</text>
    <text x="260" y="146" fill="#94a3b8" font-size="9">load webhooks (active, project)</text>
    <text x="260" y="164" fill="#94a3b8" font-size="9">matched to event</text>
    <text x="260" y="184" fill="#94a3b8" font-size="9">build payload (entry + type +</text>
    <text x="260" y="200" fill="#94a3b8" font-size="9">workspace/project ids + ts)</text></g>

  <!-- sign -->
  <g><rect x="510" y="100" width="190" height="110" rx="8" fill="#171433" stroke="#818cf8" stroke-width="2"/>
    <text x="605" y="124" text-anchor="middle" fill="#c7d2fe" font-size="10" font-weight="bold">HMAC sign</text>
    <text x="520" y="146" fill="#94a3b8" font-size="9">secret (per webhook)</text>
    <text x="520" y="164" fill="#fcd34d" font-size="9">X-Wriven-Signature</text>
    <text x="520" y="184" fill="#64748b" font-size="9">secret revealed ONCE on</text>
    <text x="520" y="200" fill="#64748b" font-size="9">create — store it client-side</text></g>

  <!-- POST -->
  <g><rect x="750" y="110" width="160" height="90" rx="8" fill="#1a0c14" stroke="#f43f5e" stroke-width="2"/>
    <text x="830" y="134" text-anchor="middle" fill="#fda4af" font-size="10" font-weight="bold">signed POST</text>
    <text x="760" y="156" fill="#94a3b8" font-size="9">→ each webhook URL</text>
    <text x="760" y="176" fill="#94a3b8" font-size="9">expect 2xx = success</text>
    <text x="760" y="192" fill="#64748b" font-size="9">consumer verifies HMAC</text></g>

  <!-- retry -->
  <g><rect x="960" y="100" width="250" height="110" rx="8" fill="#2a2008" stroke="#f59e0b" stroke-width="2"/>
    <text x="1085" y="124" text-anchor="middle" fill="#fcd34d" font-size="10" font-weight="bold">retry / backoff</text>
    <text x="970" y="146" fill="#94a3b8" font-size="9">on non-2xx / timeout</text>
    <text x="970" y="164" fill="#94a3b8" font-size="9">exponential backoff</text>
    <text x="970" y="182" fill="#94a3b8" font-size="9">→ give up after N attempts</text>
    <text x="970" y="200" fill="#fda4af" font-size="9">records lastStatus / lastFiredAt</text></g>

  <line x1="200" y1="155" x2="248" y2="155" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="460" y1="155" x2="508" y2="155" stroke="#5eead4" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="700" y1="155" x2="748" y2="155" stroke="#818cf8" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="910" y1="155" x2="958" y2="155" stroke="#f43f5e" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="934" y="148" text-anchor="middle" fill="#fda4af" font-size="9">fail</text>

  <!-- webhook entity -->
  <g><rect x="30" y="300" width="380" height="120" rx="8" fill="#0f2a2a" stroke="#14b8a6" stroke-width="2"/>
    <text x="220" y="324" text-anchor="middle" fill="#5eead4" font-size="11" font-weight="bold">webhooks (core_svc)</text>
    <line x1="40" y1="332" x2="400" y2="332" stroke="#334155"/>
    <text x="44" y="352" fill="#e2e8f0" font-size="10">url · active · events[]</text>
    <text x="44" y="370" fill="#fcd34d" font-size="10">secret (hashed at rest; plaintext once)</text>
    <text x="44" y="388" fill="#94a3b8" font-size="10">lastStatus · lastFiredAt</text>
    <text x="44" y="406" fill="#64748b" font-size="9">project-scoped; create/list/update/delete + pause</text></g>

  <!-- consumer verify -->
  <g><rect x="450" y="300" width="380" height="120" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="640" y="324" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="bold">consumer (your backend)</text>
    <line x1="460" y1="332" x2="820" y2="332" stroke="#334155"/>
    <text x="460" y="352" fill="#94a3b8" font-size="10">verify: HMAC-SHA256(secret, raw body)</text>
    <text x="460" y="370" fill="#94a3b8" font-size="10">== X-Wriven-Signature</text>
    <text x="460" y="392" fill="#fda4af" font-size="10">reject on mismatch (constant-time)</text>
    <text x="460" y="410" fill="#64748b" font-size="9">rebuild cache / sync downstream on receipt</text></g>

  <!-- gaps -->
  <g><rect x="870" y="300" width="340" height="120" rx="8" fill="#1a1a1f" stroke="#64748b" stroke-dasharray="4 4"/>
    <text x="1040" y="324" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="bold">gaps (P2)</text>
    <line x1="880" y1="332" x2="1200" y2="332" stroke="#334155"/>
    <text x="880" y="352" fill="#94a3b8" font-size="10">• no delivery log / retry-history UI</text>
    <text x="880" y="370" fill="#94a3b8" font-size="10">• no test-send</text>
    <text x="880" y="388" fill="#94a3b8" font-size="10">• limited event types (entry only)</text>
    <text x="880" y="410" fill="#64748b" font-size="9">core dispatch + retry exist; observability doesn't</text></g>

  <!-- footer -->
  <text x="620" y="470" text-anchor="middle" fill="#64748b" font-size="10">Fired from core-service on entry transitions (see 04-core-cms publish side-effect). Managed via project settings (WEBHOOK_MANAGE perm).</text>
  <text x="620" y="490" text-anchor="middle" fill="#64748b" font-size="10">Webhook management depth is a P2 market gap; the dispatch + retry engine is shipped.</text>
</svg>
