<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14b8a6"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f43f5e"/></marker>
  </defs>
  <rect width="1240" height="600" fill="#0b1120"/>

  <text x="620" y="34" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="bold">Usage Metering — Delivery Request Counter</text>
  <text x="620" y="56" text-anchor="middle" fill="#94a3b8" font-size="12">gateway batches increments off the hot path → core_svc.usage_buckets · soft fail-open overage gate (USAGE_ENFORCE, default off)</text>

  <!-- ── WRITE / COUNT lane ───────────────────────────────────────── -->
  <text x="30" y="92" fill="#64748b" font-size="10" font-weight="bold">COUNT (write path, off hot path)</text>

  <!-- reader -->
  <g><rect x="30" y="110" width="150" height="100" rx="8" fill="#171433" stroke="#818cf8" stroke-width="2"/>
    <text x="105" y="134" text-anchor="middle" fill="#c7d2fe" font-size="10" font-weight="bold">reader / SDK</text>
    <text x="40" y="156" fill="#94a3b8" font-size="9">GET /v1/projects/:p/</text>
    <text x="40" y="172" fill="#94a3b8" font-size="9">content/:apiId</text>
    <text x="40" y="194" fill="#fcd34d" font-size="9">Bearer wrk_…</text></g>

  <!-- gateway -->
  <g><rect x="220" y="100" width="220" height="120" rx="8" fill="#0c1a33" stroke="#3b82f6" stroke-width="2"/>
    <text x="330" y="124" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="bold">api-gateway · Delivery</text>
    <text x="230" y="146" fill="#94a3b8" font-size="9">1. ApiKeyGuard → resolve ws</text>
    <text x="230" y="164" fill="#fda4af" font-size="9">2. enforce (soft, fail-open)</text>
    <text x="230" y="182" fill="#94a3b8" font-size="9">3. serve published content</text>
    <text x="230" y="200" fill="#5eead4" font-size="9">4. buffer.bump(ws) +1</text></g>

  <!-- buffer -->
  <g><rect x="480" y="100" width="190" height="120" rx="8" fill="#2a2008" stroke="#f59e0b" stroke-width="2"/>
    <text x="575" y="124" text-anchor="middle" fill="#fcd34d" font-size="10" font-weight="bold">UsageBufferService</text>
    <text x="490" y="146" fill="#94a3b8" font-size="9">Map&lt;ws|period, count&gt;</text>
    <text x="490" y="164" fill="#94a3b8" font-size="9">flush @ 15s or size ≥ 100</text>
    <text x="490" y="184" fill="#64748b" font-size="9">in-process · stateless</text>
    <text x="490" y="202" fill="#64748b" font-size="9">loss on crash = ok (soft)</text></g>

  <!-- core record -->
  <g><rect x="710" y="100" width="200" height="120" rx="8" fill="#0f1f1c" stroke="#14b8a6" stroke-width="2"/>
    <text x="810" y="124" text-anchor="middle" fill="#5eead4" font-size="10" font-weight="bold">core.usage.record</text>
    <text x="720" y="146" fill="#94a3b8" font-size="9">UsageService.record()</text>
    <text x="720" y="164" fill="#94a3b8" font-size="9">atomic upsert, batched</text>
    <text x="720" y="184" fill="#fcd34d" font-size="9">ON CONFLICT(ws,period)</text>
    <text x="720" y="202" fill="#fcd34d" font-size="9">DO UPDATE SET count + n</text></g>

  <!-- usage_buckets -->
  <g><rect x="950" y="100" width="260" height="120" rx="8" fill="#0f2a2a" stroke="#14b8a6" stroke-width="2"/>
    <text x="1080" y="124" text-anchor="middle" fill="#5eead4" font-size="11" font-weight="bold">usage_buckets (core_svc)</text>
    <line x1="960" y1="132" x2="1200" y2="132" stroke="#334155"/>
    <text x="960" y="152" fill="#e2e8f0" font-size="10">workspace_id · period_start/end</text>
    <text x="960" y="170" fill="#fcd34d" font-size="10">request_count bigint</text>
    <text x="960" y="190" fill="#94a3b8" font-size="9">unique(workspace_id, period_start)</text>
    <text x="960" y="208" fill="#64748b" font-size="9">1 row / workspace × month (UTC)</text></g>

  <line x1="180" y1="160" x2="218" y2="160" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="440" y1="170" x2="478" y2="170" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="459" y="163" text-anchor="middle" fill="#93c5fd" font-size="9">+1</text>
  <line x1="670" y1="160" x2="708" y2="160" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#aa)"/>
  <text x="689" y="153" text-anchor="middle" fill="#fcd34d" font-size="9">~15s</text>
  <line x1="910" y1="160" x2="948" y2="160" stroke="#14b8a6" stroke-width="1.6" marker-end="url(#at)"/>

  <!-- ── READ / DISPLAY lane ──────────────────────────────────────── -->
  <text x="30" y="278" fill="#64748b" font-size="10" font-weight="bold">DISPLAY (read path)</text>

  <!-- dashboard -->
  <g><rect x="30" y="296" width="160" height="96" rx="8" fill="#171433" stroke="#818cf8" stroke-width="2"/>
    <text x="110" y="320" text-anchor="middle" fill="#c7d2fe" font-size="10" font-weight="bold">Usage page</text>
    <text x="40" y="342" fill="#94a3b8" font-size="9">/w/[ws]/usage</text>
    <text x="40" y="360" fill="#94a3b8" font-size="9">requests bar · storage bar</text>
    <text x="40" y="380" fill="#64748b" font-size="9">useUsage() · 60s stale</text></g>

  <!-- GET /usage -->
  <g><rect x="230" y="296" width="160" height="96" rx="8" fill="#0c1a33" stroke="#3b82f6" stroke-width="2"/>
    <text x="310" y="320" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="bold">GET /usage</text>
    <text x="240" y="342" fill="#94a3b8" font-size="9">JwtAuth + Workspace</text>
    <text x="240" y="360" fill="#94a3b8" font-size="9">any member (VIEW)</text>
    <text x="240" y="380" fill="#64748b" font-size="9">→ UsageView</text></g>

  <!-- core read -->
  <g><rect x="430" y="296" width="210" height="96" rx="8" fill="#0f1f1c" stroke="#14b8a6" stroke-width="2"/>
    <text x="535" y="320" text-anchor="middle" fill="#5eead4" font-size="10" font-weight="bold">core.usage.read</text>
    <text x="440" y="342" fill="#94a3b8" font-size="9">compose UsageView:</text>
    <text x="440" y="360" fill="#5eead4" font-size="9">requests.used + storage.usedMb</text>
    <text x="440" y="378" fill="#5eead4" font-size="9">+ limits (cached, fail-open)</text></g>

  <!-- media SUM -->
  <g><rect x="680" y="296" width="200" height="96" rx="8" fill="#0f2a2a" stroke="#14b8a6" stroke-width="2"/>
    <text x="780" y="320" text-anchor="middle" fill="#5eead4" font-size="10" font-weight="bold">media_assets SUM</text>
    <text x="690" y="342" fill="#94a3b8" font-size="9">Σ size_bytes (live media)</text>
    <text x="690" y="360" fill="#fcd34d" font-size="9">→ storage.usedMb</text>
    <text x="690" y="380" fill="#64748b" font-size="9">point-in-time, not over time</text></g>

  <!-- auth limits -->
  <g><rect x="920" y="296" width="290" height="96" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="1065" y="320" text-anchor="middle" fill="#cbd5e1" font-size="10" font-weight="bold">auth.entitlements.resolve</text>
    <text x="930" y="342" fill="#94a3b8" font-size="9">plans.limits (apiRequestsPerMonth,</text>
    <text x="930" y="360" fill="#94a3b8" font-size="9">storageMb) ⊕ subscriptions.overrides</text>
    <text x="930" y="380" fill="#64748b" font-size="9">→ effective limit (null = unlimited)</text></g>

  <line x1="190" y1="344" x2="228" y2="344" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="390" y1="344" x2="428" y2="344" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#a)"/>
  <!-- core.read pulls from the three sources -->
  <line x1="640" y1="344" x2="678" y2="344" stroke="#14b8a6" stroke-width="1.6" marker-end="url(#at)"/>
  <line x1="880" y1="344" x2="918" y2="344" stroke="#334155" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <!-- count comes from usage_buckets (top) down into core.read -->
  <path d="M 1080 222 C 1080 250, 535 250, 535 296" fill="none" stroke="#14b8a6" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#at)"/>
  <text x="800" y="246" fill="#5eead4" font-size="9">requests.used (current period)</text>

  <!-- enforce note -->
  <g><rect x="430" y="430" width="780" height="56" rx="8" fill="#1a0c14" stroke="#f43f5e" stroke-width="2"/>
    <text x="448" y="454" fill="#fda4af" font-size="10" font-weight="bold">Overage gate · USAGE_ENFORCE (default false)</text>
    <text x="448" y="472" fill="#94a3b8" font-size="9">on + used ≥ limit → Delivery returns RATE_LIMITED 429 · fail-open (lookup error / no data → allow) · metering never breaks delivery · assetBandwidthGb NOT metered (R2 keys-only)</text></g>

  <!-- footer / legend -->
  <text x="30" y="520" fill="#64748b" font-size="10">Limits live in auth_svc.plans (change via admin panel / SQL / seed) · core caches 30s · period = calendar month (UTC midnight).</text>
  <text x="30" y="540" fill="#64748b" font-size="10">Legend: ── solid = sync call · ┄┄ dashed = async / dependency · blue = gateway · teal = core-service · amber = buffer/data · indigo = client · slate = auth/shared</text>
</svg>
