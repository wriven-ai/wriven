<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5eead4"/></marker>
  </defs>
  <rect width="1240" height="820" fill="#0b1120"/>

  <text x="620" y="34" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="bold">Tenancy Data Model</text>
  <text x="620" y="56" text-anchor="middle" fill="#94a3b8" font-size="12">auth_svc — users → workspaces → projects, joined by membership rows (M:N). Roles live on the junction tables.</text>

  <!-- users -->
  <g><rect x="30" y="100" width="220" height="150" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
    <text x="140" y="124" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="bold">users</text>
    <line x1="40" y1="132" x2="240" y2="132" stroke="#334155"/>
    <text x="44" y="150" fill="#e2e8f0" font-size="10">id  uuid PK</text>
    <text x="44" y="168" fill="#94a3b8" font-size="10">email · name</text>
    <text x="44" y="186" fill="#94a3b8" font-size="10">provider · emailVerified</text>
    <text x="44" y="204" fill="#94a3b8" font-size="10">avatar · createdAt</text>
    <text x="44" y="228" fill="#64748b" font-size="9">platform admin identity lives</text>
    <text x="44" y="242" fill="#64748b" font-size="9">separately in admin_users</text></g>

  <!-- workspace_members (junction) -->
  <g><rect x="320" y="100" width="260" height="150" rx="10" fill="#0f2a2a" stroke="#14b8a6" stroke-width="2"/>
    <text x="450" y="124" text-anchor="middle" fill="#5eead4" font-size="11" font-weight="bold">workspace_members</text>
    <line x1="330" y1="132" x2="570" y2="132" stroke="#334155"/>
    <text x="334" y="150" fill="#e2e8f0" font-size="10">id PK · createdAt</text>
    <text x="334" y="168" fill="#fcd34d" font-size="10">workspaceId  FK → workspaces</text>
    <text x="334" y="186" fill="#fcd34d" font-size="10">userId       FK → users</text>
    <text x="334" y="208" fill="#fda4af" font-size="10" font-weight="bold">role  text + CHECK</text>
    <text x="334" y="226" fill="#94a3b8" font-size="10">owner · admin · member · guest</text></g>

  <!-- workspaces -->
  <g><rect x="650" y="100" width="230" height="150" rx="10" fill="#0f2a2a" stroke="#14b8a6" stroke-width="2"/>
    <text x="765" y="124" text-anchor="middle" fill="#5eead4" font-size="11" font-weight="bold">workspaces</text>
    <line x1="660" y1="132" x2="870" y2="132" stroke="#334155"/>
    <text x="664" y="150" fill="#e2e8f0" font-size="10">id PK</text>
    <text x="664" y="168" fill="#94a3b8" font-size="10">name · slug</text>
    <text x="664" y="186" fill="#94a3b8" font-size="10">createdBy  FK → users</text>
    <text x="664" y="204" fill="#94a3b8" font-size="10">createdAt</text>
    <text x="664" y="226" fill="#64748b" font-size="9">top-level tenancy unit.</text>
    <text x="664" y="240" fill="#64748b" font-size="9">owner = creator on signup</text></g>

  <!-- project_members (junction) -->
  <g><rect x="320" y="340" width="260" height="150" rx="10" fill="#1c1206" stroke="#f59e0b" stroke-width="2"/>
    <text x="450" y="364" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="bold">project_members</text>
    <line x1="330" y1="372" x2="570" y2="372" stroke="#334155"/>
    <text x="334" y="390" fill="#e2e8f0" font-size="10">id PK · createdAt</text>
    <text x="334" y="408" fill="#fcd34d" font-size="10">projectId  FK → projects</text>
    <text x="334" y="426" fill="#fcd34d" font-size="10">userId     FK → users</text>
    <text x="334" y="448" fill="#fda4af" font-size="10" font-weight="bold">role  text + CHECK</text>
    <text x="334" y="466" fill="#94a3b8" font-size="10">admin · editor · viewer</text>
    <text x="334" y="482" fill="#64748b" font-size="9">optional — ws owner/admin</text>
    <text x="334" y="496" fill="#64748b" font-size="9">need NO row (cascade)</text></g>

  <!-- projects -->
  <g><rect x="650" y="340" width="230" height="150" rx="10" fill="#0f2a2a" stroke="#14b8a6" stroke-width="2"/>
    <text x="765" y="364" text-anchor="middle" fill="#5eead4" font-size="11" font-weight="bold">projects</text>
    <line x1="660" y1="372" x2="870" y2="372" stroke="#334155"/>
    <text x="664" y="390" fill="#e2e8f0" font-size="10">id PK</text>
    <text x="664" y="408" fill="#fcd34d" font-size="10">workspaceId  FK → workspaces</text>
    <text x="664" y="426" fill="#94a3b8" font-size="10">name · slug</text>
    <text x="664" y="444" fill="#94a3b8" font-size="10">createdBy · createdAt</text>
    <text x="664" y="462" fill="#94a3b8" font-size="10">deletedAt (soft delete)</text>
    <text x="664" y="482" fill="#64748b" font-size="9">owns CMS content</text></g>

  <!-- invitations -->
  <g><rect x="30" y="340" width="240" height="160" rx="10" fill="#2a0f1a" stroke="#f43f5e" stroke-width="2"/>
    <text x="150" y="364" text-anchor="middle" fill="#fda4af" font-size="11" font-weight="bold">invitations</text>
    <line x1="40" y1="372" x2="250" y2="372" stroke="#334155"/>
    <text x="44" y="390" fill="#e2e8f0" font-size="10">id PK</text>
    <text x="44" y="408" fill="#94a3b8" font-size="10">scope: workspace | project</text>
    <text x="44" y="426" fill="#fcd34d" font-size="10">workspaceId  FK</text>
    <text x="44" y="444" fill="#fcd34d" font-size="10">projectId?   FK (nullable)</text>
    <text x="44" y="462" fill="#94a3b8" font-size="10">email · role</text>
    <text x="44" y="480" fill="#94a3b8" font-size="10">status · expiresAt</text>
    <text x="44" y="498" fill="#64748b" font-size="9">accept → seeds a member row</text></g>

  <!-- core_svc cluster -->
  <g><rect x="940" y="340" width="270" height="200" rx="10" fill="#1a1a1f" stroke="#64748b" stroke-dasharray="4 4"/>
    <text x="1075" y="362" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="bold">core_svc (project-scoped)</text>
    <text x="950" y="384" fill="#94a3b8" font-size="10">content_types</text>
    <text x="950" y="402" fill="#94a3b8" font-size="10">content_entries</text>
    <text x="950" y="420" fill="#94a3b8" font-size="10">media_assets</text>
    <text x="950" y="438" fill="#94a3b8" font-size="10">api_keys</text>
    <text x="950" y="456" fill="#94a3b8" font-size="10">webhooks</text>
    <text x="950" y="484" fill="#fcd34d" font-size="10">all carry projectId (logical,</text>
    <text x="950" y="500" fill="#fcd34d" font-size="10">workspaceId denormalized)</text>
    <text x="950" y="520" fill="#64748b" font-size="9">no cross-schema FK enforced;</text>
    <text x="950" y="534" fill="#64748b" font-size="9">gateway injects the scope</text></g>

  <!-- relationships -->
  <!-- users -- workspace_members -->
  <line x1="250" y1="175" x2="318" y2="175" stroke="#5eead4" stroke-width="1.6"/>
  <text x="284" y="168" text-anchor="middle" fill="#5eead4" font-size="10">1</text>
  <text x="310" y="168" text-anchor="end" fill="#5eead4" font-size="10">M</text>
  <!-- workspace_members -- workspaces -->
  <line x1="580" y1="175" x2="648" y2="175" stroke="#5eead4" stroke-width="1.6"/>
  <text x="612" y="168" text-anchor="middle" fill="#5eead4" font-size="10">M</text>
  <text x="644" y="168" text-anchor="end" fill="#5eead4" font-size="10">1</text>
  <text x="614" y="192" text-anchor="middle" fill="#64748b" font-size="9">M:N membership</text>
  <!-- workspaces -- projects (1:M) -->
  <line x1="765" y1="250" x2="765" y2="338" stroke="#5eead4" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="780" y="266" fill="#5eead4" font-size="10">1</text>
  <text x="780" y="332" fill="#5eead4" font-size="10">M</text>
  <text x="876" y="296" fill="#64748b" font-size="9">has many</text>
  <!-- projects -- project_members -->
  <line x1="648" y1="415" x2="582" y2="415" stroke="#5eead4" stroke-width="1.6"/>
  <text x="614" y="408" text-anchor="middle" fill="#5eead4" font-size="10">1</text>
  <text x="588" y="408" text-anchor="end" fill="#5eead4" font-size="10">M</text>
  <!-- users -- project_members (the M:N) -->
  <path d="M140,250 C 140,300 250,300 320,395" fill="none" stroke="#5eead4" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="180" y="300" fill="#5eead4" font-size="9">M (same users)</text>
  <!-- invitations -> workspaces/projects -->
  <path d="M270,400 C 300,360 350,330 650,200" fill="none" stroke="#f43f5e" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="420" y="312" fill="#fda4af" font-size="9">resolves to a workspace or project</text>
  <!-- projects -> core_svc -->
  <line x1="880" y1="415" x2="938" y2="415" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="909" y="408" text-anchor="middle" fill="#64748b" font-size="9">scope</text>

  <!-- footer notes -->
  <g><rect x="30" y="560" width="1180" height="120" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="50" y="584" fill="#94a3b8" font-size="11" font-weight="bold">RULES ENCODED</text>
    <text x="50" y="606" fill="#e2e8f0" font-size="10">• A user's role is NOT a single value — it's a per-workspace row + a per-project row. effectivePermissions unions them.</text>
    <text x="50" y="626" fill="#e2e8f0" font-size="10">• project_members is OPTIONAL: workspace owner/admin access projects through the cascade with no row here.</text>
    <text x="50" y="646" fill="#e2e8f0" font-size="10">• Invariants: ≥1 owner per workspace, ≥1 admin per project; only a workspace owner may grant/transfer owner (WORKSPACE_ROLE_ASSIGN).</text>
    <text x="50" y="666" fill="#e2e8f0" font-size="10">• Single shared Postgres, schema-isolated (auth_svc / core_svc). core_svc rows carry projectId but no enforced cross-schema FK — the gateway injects scope.</text>
  </g>

  <text x="620" y="710" text-anchor="middle" fill="#64748b" font-size="10">Sessions/tokens (refresh, verify, reset) and subscriptions also live in auth_svc — omitted for clarity.</text>
</svg>
