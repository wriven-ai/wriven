<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1200" height="840" fill="#0b1120"/>

  <!-- Title -->
  <text x="600" y="34" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="bold">Wriven — System Overview</text>
  <text x="600" y="56" text-anchor="middle" fill="#94a3b8" font-size="12">Nx + pnpm monorepo · NestJS microservices behind one HTTP gateway · Next.js client</text>

  <!-- Group: Backend services -->
  <rect x="480" y="80" width="260" height="350" rx="14" fill="#0f2a2a" stroke="#14b8a6" stroke-opacity="0.4" stroke-dasharray="4 4"/>
  <text x="610" y="100" text-anchor="middle" fill="#5eead4" font-size="11" font-weight="bold">BACKEND MICROSERVICES · TCP</text>

  <!-- Group: Data -->
  <rect x="790" y="80" width="220" height="250" rx="14" fill="#2a2008" fill-opacity="0.6" stroke="#f59e0b" stroke-opacity="0.4" stroke-dasharray="4 4"/>
  <text x="900" y="100" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="bold">DATA LAYER</text>

  <!-- Group: External -->
  <rect x="1040" y="80" width="150" height="250" rx="14" fill="#2a0f1a" fill-opacity="0.6" stroke="#f43f5e" stroke-opacity="0.4" stroke-dasharray="4 4"/>
  <text x="1115" y="100" text-anchor="middle" fill="#fda4af" font-size="11" font-weight="bold">EXTERNAL</text>

  <!-- Group: Shared libs -->
  <rect x="180" y="690" width="840" height="110" rx="14" fill="#1e1b3a" fill-opacity="0.6" stroke="#818cf8" stroke-opacity="0.4" stroke-dasharray="4 4"/>
  <text x="600" y="710" text-anchor="middle" fill="#c7d2fe" font-size="11" font-weight="bold">SHARED LIBS · libs/shared/*</text>

  <!-- Node: Client -->
  <g>
    <rect x="40" y="150" width="170" height="110" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
    <text x="125" y="178" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="bold">FRONTEND</text>
    <text x="125" y="202" text-anchor="middle" fill="#e2e8f0" font-weight="bold">Next.js client</text>
    <text x="125" y="222" text-anchor="middle" fill="#94a3b8" font-size="11">@wriven/client</text>
    <text x="125" y="242" text-anchor="middle" fill="#64748b" font-size="10">cookies + CSRF · Zustand</text>
  </g>

  <!-- Node: Gateway -->
  <g>
    <rect x="260" y="150" width="200" height="140" rx="10" fill="#0c1a33" stroke="#3b82f6" stroke-width="2"/>
    <text x="360" y="178" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="bold">EDGE</text>
    <text x="360" y="202" text-anchor="middle" fill="#e2e8f0" font-weight="bold">api-gateway</text>
    <text x="360" y="222" text-anchor="middle" fill="#60a5fa" font-size="11">HTTP :5000</text>
    <text x="360" y="244" text-anchor="middle" fill="#94a3b8" font-size="10">JWT validate · guards</text>
    <text x="360" y="262" text-anchor="middle" fill="#94a3b8" font-size="10">RBAC enforce (core routes)</text>
    <text x="360" y="280" text-anchor="middle" fill="#64748b" font-size="10">owns no tables</text>
  </g>

  <!-- Node: auth-service -->
  <g>
    <rect x="500" y="120" width="220" height="100" rx="10" fill="#0f1f1c" stroke="#14b8a6" stroke-width="2"/>
    <text x="610" y="144" text-anchor="middle" fill="#e2e8f0" font-weight="bold">auth-service</text>
    <text x="610" y="164" text-anchor="middle" fill="#5eead4" font-size="11">TCP :5001</text>
    <text x="610" y="186" text-anchor="middle" fill="#94a3b8" font-size="10">identity + tenancy</text>
    <text x="610" y="204" text-anchor="middle" fill="#94a3b8" font-size="10">RBAC resolver · auth_svc</text>
  </g>

  <!-- Node: core-service -->
  <g>
    <rect x="500" y="240" width="220" height="100" rx="10" fill="#0f1f1c" stroke="#14b8a6" stroke-width="2"/>
    <text x="610" y="264" text-anchor="middle" fill="#e2e8f0" font-weight="bold">core-service</text>
    <text x="610" y="284" text-anchor="middle" fill="#5eead4" font-size="11">TCP :5002</text>
    <text x="610" y="306" text-anchor="middle" fill="#94a3b8" font-size="10">CMS · content · media</text>
    <text x="610" y="324" text-anchor="middle" fill="#94a3b8" font-size="10">webhooks · delivery · core_svc</text>
  </g>

  <!-- Node: ai-service -->
  <g>
    <rect x="500" y="360" width="220" height="60" rx="10" fill="#1a1a1f" stroke="#64748b" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="610" y="384" text-anchor="middle" fill="#cbd5e1" font-weight="bold">ai-service · HTTP :8000</text>
    <text x="610" y="404" text-anchor="middle" fill="#64748b" font-size="10">AI content generation (Python/FastAPI)</text>
  </g>

  <!-- Node: Postgres -->
  <g>
    <rect x="810" y="120" width="180" height="80" rx="10" fill="#1f1604" stroke="#f59e0b" stroke-width="2"/>
    <text x="900" y="144" text-anchor="middle" fill="#e2e8f0" font-weight="bold">Postgres · Supabase</text>
    <text x="900" y="166" text-anchor="middle" fill="#fcd34d" font-size="10">shared, schema-isolated</text>
    <text x="900" y="184" text-anchor="middle" fill="#94a3b8" font-size="10">auth_svc · core_svc</text>
  </g>

  <!-- Node: R2 -->
  <g>
    <rect x="810" y="220" width="180" height="70" rx="10" fill="#1f1604" stroke="#f59e0b" stroke-width="2"/>
    <text x="900" y="244" text-anchor="middle" fill="#e2e8f0" font-weight="bold">Cloudflare R2</text>
    <text x="900" y="266" text-anchor="middle" fill="#fcd34d" font-size="10">media object store</text>
    <text x="900" y="282" text-anchor="middle" fill="#94a3b8" font-size="10">keys-only in DB</text>
  </g>

  <!-- Node: Stripe -->
  <g>
    <rect x="1050" y="120" width="130" height="60" rx="10" fill="#1a0c14" stroke="#f43f5e" stroke-width="2"/>
    <text x="1115" y="148" text-anchor="middle" fill="#e2e8f0" font-weight="bold">Stripe</text>
    <text x="1115" y="168" text-anchor="middle" fill="#fda4af" font-size="10">billing</text>
  </g>

  <!-- Node: CDN -->
  <g>
    <rect x="1050" y="200" width="130" height="60" rx="10" fill="#1a0c14" stroke="#f43f5e" stroke-width="2"/>
    <text x="1115" y="228" text-anchor="middle" fill="#e2e8f0" font-weight="bold">Cloudflare CDN</text>
    <text x="1115" y="248" text-anchor="middle" fill="#fda4af" font-size="10">cache + tag purge</text>
  </g>

  <!-- Node: SMTP -->
  <g>
    <rect x="1050" y="280" width="130" height="60" rx="10" fill="#1a0c14" stroke="#f43f5e" stroke-width="2"/>
    <text x="1115" y="308" text-anchor="middle" fill="#e2e8f0" font-weight="bold">Gmail SMTP</text>
    <text x="1115" y="328" text-anchor="middle" fill="#fda4af" font-size="10">tx email (dev)</text>
  </g>

  <!-- Shared libs nodes -->
  <g>
    <rect x="240" y="725" width="350" height="60" rx="10" fill="#171433" stroke="#818cf8" stroke-width="2"/>
    <text x="415" y="750" text-anchor="middle" fill="#e2e8f0" font-weight="bold">@wriven/contracts</text>
    <text x="415" y="770" text-anchor="middle" fill="#c7d2fe" font-size="10">DTOs · types · patterns · errors · RBAC maps</text>
  </g>
  <g>
    <rect x="620" y="725" width="240" height="60" rx="10" fill="#171433" stroke="#818cf8" stroke-width="2"/>
    <text x="740" y="750" text-anchor="middle" fill="#e2e8f0" font-weight="bold">@wriven/database</text>
    <text x="740" y="770" text-anchor="middle" fill="#c7d2fe" font-size="10">Drizzle + schemas</text>
  </g>

  <!-- ===== EDGES ===== -->
  <!-- Client -> Gateway -->
  <line x1="210" y1="205" x2="258" y2="205" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="234" y="197" text-anchor="middle" fill="#94a3b8" font-size="10">HTTP</text>

  <!-- Gateway -> auth (TCP) -->
  <line x1="460" y1="185" x2="498" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="486" y="150" text-anchor="middle" fill="#5eead4" font-size="10">TCP</text>

  <!-- Gateway -> core (TCP) -->
  <line x1="460" y1="245" x2="498" y2="278" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="486" y="262" text-anchor="middle" fill="#5eead4" font-size="10">TCP</text>

  <!-- core -> ai (HTTP, the exception) -->
  <line x1="610" y1="340" x2="610" y2="358" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="660" y="354" fill="#fda4af" font-size="10">HTTP (core → ai-service)</text>

  <!-- Stripe -.-> Gateway webhook -->
  <path d="M1050,150 C 900,400 500,420 360,292" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>
  <text x="720" y="470" fill="#94a3b8" font-size="10">webhook (raw body) → auth-service</text>

  <!-- Gateway -> Stripe checkout/portal -->
  <line x1="460" y1="160" x2="1048" y2="145" stroke="#475569" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>
  <text x="760" y="120" fill="#94a3b8" font-size="10">Checkout / Portal</text>

  <!-- auth -> pg -->
  <line x1="720" y1="155" x2="808" y2="155" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- core -> pg -->
  <line x1="720" y1="265" x2="808" y2="185" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- core -> R2 -->
  <line x1="720" y1="280" x2="808" y2="255" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="765" y="232" fill="#94a3b8" font-size="10">keys</text>
  <!-- core -> CDN -->
  <path d="M720,300 C 950,360 1030,300 1048,235" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="830" y="356" fill="#94a3b8" font-size="10">purge on publish</text>
  <!-- auth -> SMTP -->
  <path d="M720,140 C 950,90 1000,250 1048,300" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="940" y="92" fill="#94a3b8" font-size="10">email</text>

  <!-- Shared libs consumed (dashed up to services) -->
  <line x1="415" y1="725" x2="360" y2="292" stroke="#818cf8" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.5"/>
  <line x1="470" y1="725" x2="610" y2="220" stroke="#818cf8" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.5"/>
  <line x1="540" y1="725" x2="610" y2="340" stroke="#818cf8" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.5"/>
  <line x1="740" y1="725" x2="610" y2="240" stroke="#818cf8" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.5"/>
  <text x="600" y="676" text-anchor="middle" fill="#818cf8" font-size="10" opacity="0.7">consumed by all NestJS services + client</text>

  <!-- Legend -->
  <g transform="translate(40,690)">
    <rect x="0" y="0" width="120" height="110" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="10" y="18" fill="#94a3b8" font-size="10" font-weight="bold">LEGEND</text>
    <line x1="10" y1="36" x2="40" y2="36" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="46" y="40" fill="#cbd5e1" font-size="10">call</text>
    <line x1="10" y1="56" x2="40" y2="56" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>
    <text x="46" y="60" fill="#cbd5e1" font-size="10">async / webhook</text>
    <line x1="10" y1="76" x2="40" y2="76" stroke="#818cf8" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.7"/>
    <text x="46" y="80" fill="#cbd5e1" font-size="10">lib dependency</text>
    <rect x="10" y="90" width="14" height="10" rx="2" fill="#1a1a1f" stroke="#64748b" stroke-dasharray="2 2"/>
    <text x="30" y="99" fill="#cbd5e1" font-size="10">unbuilt</text>
  </g>

  <!-- Footer rules -->
  <text x="600" y="822" text-anchor="middle" fill="#64748b" font-size="10">Gateway injects identity (userId + scope) into every TCP payload · core-service trusts it · all NestJS↔NestJS = TCP · response envelope {success,data}/{success,error}</text>
</svg>
