<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
  </defs>
  <rect width="1240" height="1200" fill="#0b1120"/>

  <text x="620" y="34" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="bold">Billing — Stripe Flow</text>
  <text x="620" y="56" text-anchor="middle" fill="#94a3b8" font-size="12">Checkout (free→paid) · /billing/swap (paid→paid: immediate upgrade / deferred downgrade) · webhook reconciler → subscriptions → entitlements</text>

  <!-- ===== CHECKOUT FLOW ===== -->
  <text x="40" y="92" fill="#fcd34d" font-size="12" font-weight="bold">CHECKOUT (free → paid upgrade)</text>
  <g><rect x="30" y="100" width="120" height="60" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
    <text x="90" y="124" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="bold">client</text>
    <text x="90" y="142" text-anchor="middle" fill="#64748b" font-size="9">“Upgrade”</text></g>

  <g><rect x="190" y="95" width="180" height="80" rx="8" fill="#0c1a33" stroke="#3b82f6" stroke-width="2"/>
    <text x="280" y="118" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="bold">api-gateway</text>
    <text x="280" y="136" text-anchor="middle" fill="#94a3b8" font-size="9">POST /billing/checkout</text>
    <text x="280" y="152" text-anchor="middle" fill="#fcd34d" font-size="9">PermissionGuard:</text>
    <text x="280" y="166" text-anchor="middle" fill="#fcd34d" font-size="9">BILLING_MANAGE</text></g>

  <g><rect x="410" y="95" width="180" height="80" rx="8" fill="#0f1f1c" stroke="#14b8a6" stroke-width="2"/>
    <text x="500" y="118" text-anchor="middle" fill="#5eead4" font-size="10" font-weight="bold">auth-service</text>
    <text x="500" y="136" text-anchor="middle" fill="#94a3b8" font-size="9">BillingService</text>
    <text x="500" y="152" text-anchor="middle" fill="#94a3b8" font-size="9">authorize() (re-check)</text>
    <text x="500" y="166" text-anchor="middle" fill="#64748b" font-size="9">+ plans lookup</text></g>

  <g><rect x="630" y="100" width="130" height="60" rx="8" fill="#1a0c14" stroke="#f43f5e" stroke-width="2"/>
    <text x="695" y="124" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="bold">Stripe</text>
    <text x="695" y="142" text-anchor="middle" fill="#fda4af" font-size="9">Checkout Session</text></g>

  <g><rect x="810" y="100" width="130" height="60" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
    <text x="875" y="124" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="bold">hosted page</text>
    <text x="875" y="142" text-anchor="middle" fill="#64748b" font-size="9">→ redirect back</text></g>

  <line x1="150" y1="130" x2="188" y2="130" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="370" y1="130" x2="408" y2="130" stroke="#5eead4" stroke-width="1.6" marker-end="url(#a)"/><text x="389" y="123" text-anchor="middle" fill="#5eead4" font-size="9">TCP</text>
  <line x1="590" y1="130" x2="628" y2="130" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="760" y1="130" x2="808" y2="130" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M810,150 C 500,210 200,210 90,162" fill="none" stroke="#475569" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="430" y="206" fill="#64748b" font-size="9">successUrl redirect (session id) — collects card once → saved on the Customer</text>

  <!-- ===== SWAP FLOW (specs/15 + specs/16) ===== -->
  <text x="40" y="252" fill="#fcd34d" font-size="12" font-weight="bold">SWAP  /billing/swap  (paid → paid · in-app · no redirect)</text>
  <g><rect x="30" y="262" width="120" height="60" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
    <text x="90" y="286" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="bold">client</text>
    <text x="90" y="304" text-anchor="middle" fill="#64748b" font-size="9">Upgrade · Downgrade · Switch</text></g>

  <g><rect x="190" y="257" width="180" height="70" rx="8" fill="#0c1a33" stroke="#3b82f6" stroke-width="2"/>
    <text x="280" y="278" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="bold">api-gateway</text>
    <text x="280" y="296" text-anchor="middle" fill="#94a3b8" font-size="9">POST /billing/swap</text>
    <text x="280" y="312" text-anchor="middle" fill="#fcd34d" font-size="9">BILLING_MANAGE</text></g>

  <g><rect x="410" y="252" width="220" height="80" rx="8" fill="#0f1f1c" stroke="#14b8a6" stroke-width="2"/>
    <text x="520" y="274" text-anchor="middle" fill="#5eead4" font-size="10" font-weight="bold">BillingService.swapPlan</text>
    <text x="520" y="292" text-anchor="middle" fill="#94a3b8" font-size="9">release pending schedule first</text>
    <text x="520" y="308" text-anchor="middle" fill="#94a3b8" font-size="9">then route by direction</text>
    <text x="520" y="324" text-anchor="middle" fill="#64748b" font-size="9">(tierDelta = target − current)</text></g>

  <g><rect x="680" y="252" width="180" height="80" rx="8" fill="#1a0c14" stroke="#f43f5e" stroke-width="2"/>
    <text x="770" y="274" text-anchor="middle" fill="#fda4af" font-size="10" font-weight="bold">Stripe</text>
    <text x="770" y="292" text-anchor="middle" fill="#94a3b8" font-size="9">subscriptions.update</text>
    <text x="770" y="308" text-anchor="middle" fill="#94a3b8" font-size="9">OR subscription_schedules</text>
    <text x="770" y="324" text-anchor="middle" fill="#64748b" font-size="9">.create / .release</text></g>

  <line x1="150" y1="292" x2="188" y2="292" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="370" y1="292" x2="408" y2="292" stroke="#5eead4" stroke-width="1.6" marker-end="url(#a)"/><text x="389" y="285" text-anchor="middle" fill="#5eead4" font-size="9">TCP</text>
  <line x1="630" y1="292" x2="678" y2="292" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- swap outcome branches -->
  <g><rect x="30" y="360" width="370" height="118" rx="8" fill="#062b1a" stroke="#34d399" stroke-width="2"/>
    <text x="45" y="382" fill="#34d399" font-size="11" font-weight="bold">UPGRADE / CYCLE-SWITCH  (tierDelta ≥ 0)</text>
    <text x="45" y="404" fill="#e2e8f0" font-size="10">subscriptions.update( items, price )</text>
    <text x="45" y="422" fill="#94a3b8" font-size="10">proration_behavior: always_invoice</text>
    <text x="45" y="440" fill="#94a3b8" font-size="10">→ prorated diff charged now</text>
    <text x="45" y="458" fill="#64748b" font-size="9">access flips immediately → webhook flips row</text></g>

  <g><rect x="415" y="360" width="445" height="118" rx="8" fill="#2a2008" stroke="#f59e0b" stroke-width="2"/>
    <text x="430" y="382" fill="#fcd34d" font-size="11" font-weight="bold">DOWNGRADE  (tierDelta &lt; 0) — DEFERRED · specs/16</text>
    <text x="430" y="404" fill="#e2e8f0" font-size="10">subscription_schedules.create( 2 phases )</text>
    <text x="430" y="422" fill="#94a3b8" font-size="10">proration_behavior: none</text>
    <text x="430" y="440" fill="#94a3b8" font-size="10">phase 1: current price → period_end</text>
    <text x="430" y="458" fill="#94a3b8" font-size="10">phase 2: lower price (at renewal)</text>
    <text x="430" y="474" fill="#fcd34d" font-size="9">write pending_change {target, scheduleId, effectiveAt}</text></g>

  <g><rect x="875" y="360" width="335" height="118" rx="8" fill="#1a0c14" stroke="#f43f5e" stroke-width="2"/>
    <text x="890" y="382" fill="#fda4af" font-size="11" font-weight="bold">CANCEL → FREE · REACTIVATE</text>
    <text x="890" y="404" fill="#e2e8f0" font-size="10">free: cancel_at_period_end</text>
    <text x="890" y="422" fill="#94a3b8" font-size="10">(deferred — access until period end)</text>
    <text x="890" y="446" fill="#e2e8f0" font-size="10">reactivate (target = current):</text>
    <text x="890" y="464" fill="#94a3b8" font-size="10">schedules.release + clear</text>
    <text x="890" y="478" fill="#94a3b8" font-size="10">pending_change</text></g>

  <!-- pending_change → period-end loop -->
  <path d="M637,478 C 700,540 880,540 940,478" fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#am)"/>
  <text x="790" y="558" text-anchor="middle" fill="#f59e0b" font-size="9">[period end] phase 2 lands → customer.subscription.updated</text>

  <!-- ===== WEBHOOK FLOW ===== -->
  <text x="40" y="592" fill="#fcd34d" font-size="12" font-weight="bold">WEBHOOK → RECONCILER (source of truth · no cron)</text>
  <g><rect x="80" y="610" width="120" height="60" rx="8" fill="#1a0c14" stroke="#f43f5e" stroke-width="2"/>
    <text x="140" y="634" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="bold">Stripe</text>
    <text x="140" y="652" text-anchor="middle" fill="#fda4af" font-size="9">events</text></g>

  <g><rect x="250" y="605" width="200" height="80" rx="8" fill="#0c1a33" stroke="#3b82f6" stroke-width="2"/>
    <text x="350" y="628" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="bold">gateway /webhooks/stripe</text>
    <text x="350" y="646" text-anchor="middle" fill="#fcd34d" font-size="9">rawBody: true (signature)</text>
    <text x="350" y="664" text-anchor="middle" fill="#94a3b8" font-size="9">forwards to auth-service</text>
    <text x="350" y="678" text-anchor="middle" fill="#64748b" font-size="9">no JWT (public)</text></g>

  <g><rect x="500" y="605" width="210" height="80" rx="8" fill="#0f1f1c" stroke="#14b8a6" stroke-width="2"/>
    <text x="605" y="628" text-anchor="middle" fill="#5eead4" font-size="10" font-weight="bold">StripeWebhookService</text>
    <text x="605" y="646" text-anchor="middle" fill="#94a3b8" font-size="9">verify HMAC signature</text>
    <text x="605" y="662" text-anchor="middle" fill="#94a3b8" font-size="9">idempotent reconcile</text>
    <text x="605" y="678" text-anchor="middle" fill="#94a3b8" font-size="9">(status · period · plan←price)</text></g>

  <g><rect x="760" y="605" width="170" height="80" rx="8" fill="#0f2a2a" stroke="#14b8a6" stroke-width="2"/>
    <text x="845" y="628" text-anchor="middle" fill="#5eead4" font-size="10" font-weight="bold">subscriptions</text>
    <text x="845" y="646" text-anchor="middle" fill="#fcd34d" font-size="9">auth_svc row</text>
    <text x="845" y="662" text-anchor="middle" fill="#94a3b8" font-size="9">planKey · status · period</text>
    <text x="845" y="678" text-anchor="middle" fill="#94a3b8" font-size="9">pending_change · hasPaymentMethod</text></g>

  <g><rect x="980" y="610" width="180" height="60" rx="8" fill="#171433" stroke="#818cf8" stroke-width="2"/>
    <text x="1070" y="634" text-anchor="middle" fill="#c7d2fe" font-size="10" font-weight="bold">EntitlementsService</text>
    <text x="1070" y="652" text-anchor="middle" fill="#94a3b8" font-size="9">reads the row → limits</text></g>

  <line x1="200" y1="640" x2="248" y2="640" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="224" y="633" text-anchor="middle" fill="#fda4af" font-size="9">POST</text>
  <line x1="450" y1="645" x2="498" y2="645" stroke="#5eead4" stroke-width="1.6" marker-end="url(#a)"/><text x="474" y="638" text-anchor="middle" fill="#5eead4" font-size="9">TCP</text>
  <line x1="710" y1="645" x2="758" y2="645" stroke="#34d399" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="930" y1="645" x2="978" y2="645" stroke="#818cf8" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- ===== SUBSCRIPTION STATES ===== -->
  <text x="40" y="732" fill="#fcd34d" font-size="12" font-weight="bold">SUBSCRIPTION STATE → ENTITLEMENTS (enforcement reads this)</text>
  <g font-size="10">
    <g><rect x="60" y="750" width="110" height="44" rx="22" fill="#062b1a" stroke="#34d399" stroke-width="2"/><text x="115" y="778" text-anchor="middle" fill="#34d399" font-weight="bold">active</text></g>
    <g><rect x="200" y="750" width="110" height="44" rx="22" fill="#2a2008" stroke="#f59e0b" stroke-width="2"/><text x="255" y="778" text-anchor="middle" fill="#fcd34d" font-weight="bold">past_due</text></g>
    <g><rect x="340" y="750" width="110" height="44" rx="22" fill="#2a0f1a" stroke="#f43f5e" stroke-width="2"/><text x="395" y="778" text-anchor="middle" fill="#fda4af" font-weight="bold">canceled</text></g>
    <g><rect x="480" y="750" width="110" height="44" rx="22" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/><text x="535" y="778" text-anchor="middle" fill="#cbd5e1" font-weight="bold">paused</text></g>
  </g>
  <text x="640" y="764" fill="#94a3b8" font-size="10">→ EntitlementsService gates: projects, members, entries,</text>
  <text x="640" y="782" fill="#94a3b8" font-size="10">   content types, api keys, webhooks, storage (plan limits).</text>
  <text x="640" y="800" fill="#64748b" font-size="9">plan changes need zero enforcement-code change — they just rewrite the row (immediately, or at period end for deferred downgrades).</text>

  <!-- ===== PLANS / PORTAL ===== -->
  <text x="40" y="852" fill="#fcd34d" font-size="12" font-weight="bold">PLANS · PORTAL</text>
  <g><rect x="30" y="865" width="260" height="90" rx="8" fill="#0f2a2a" stroke="#14b8a6" stroke-width="2"/>
    <text x="160" y="888" text-anchor="middle" fill="#5eead4" font-size="10" font-weight="bold">plans</text>
    <text x="40" y="908" fill="#94a3b8" font-size="9">free · starter · pro</text>
    <text x="40" y="924" fill="#94a3b8" font-size="9">limits + features JSON</text>
    <text x="40" y="940" fill="#fcd34d" font-size="9">stripePriceId backfilled</text>
    <text x="40" y="954" fill="#64748b" font-size="9">(sandbox) + admin sync</text></g>

  <g><rect x="320" y="865" width="280" height="90" rx="8" fill="#0c1a33" stroke="#3b82f6" stroke-width="2"/>
    <text x="460" y="888" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="bold">Billing Portal</text>
    <text x="330" y="908" fill="#94a3b8" font-size="9">POST /billing/portal (BILLING_MANAGE)</text>
    <text x="330" y="924" fill="#94a3b8" font-size="9">→ Stripe hosted portal session</text>
    <text x="330" y="940" fill="#94a3b8" font-size="9">user manages card / cancels</text>
    <text x="330" y="954" fill="#64748b" font-size="9">changes flow back through the webhook</text></g>

  <g><rect x="630" y="865" width="280" height="90" rx="8" fill="#2a0f1a" stroke="#f43f5e" stroke-width="2"/>
    <text x="770" y="888" text-anchor="middle" fill="#fda4af" font-size="10" font-weight="bold">Managed Payments opt-out</text>
    <text x="640" y="908" fill="#94a3b8" font-size="9">Wriven can disable Stripe-managed</text>
    <text x="640" y="924" fill="#94a3b8" font-size="9">dunning (terminal outcome: cancel vs</text>
    <text x="640" y="940" fill="#94a3b8" font-size="9">unpaid) — open product decision.</text>
    <text x="640" y="954" fill="#64748b" font-size="9">Trials removed (no trial system).</text></g>

  <!-- footer -->
  <g><rect x="30" y="985" width="1180" height="135" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="50" y="1009" fill="#94a3b8" font-size="11" font-weight="bold">RULES ENCODED</text>
    <text x="50" y="1031" fill="#e2e8f0" font-size="10">• The webhook reconciler is the single source of truth — the gateway NEVER writes subscription state; Stripe events drive it (idempotent, replayable).</text>
    <text x="50" y="1051" fill="#e2e8f0" font-size="10">• Entitlements READ the subscriptions row, so plan changes need no enforcement-code change (immediate for upgrades, at period end for deferred downgrades).</text>
    <text x="50" y="1071" fill="#e2e8f0" font-size="10">• /billing/swap only mutates Stripe + the pending_change hint — it never sets the effective plan itself (the reconciler does, when the event lands). No cron.</text>
    <text x="50" y="1091" fill="#e2e8f0" font-size="10">• Downgrades defer via Subscription Schedules (keep access until period end); upgrades charge the prorated difference now (always_invoice).</text>
    <text x="50" y="1111" fill="#e2e8f0" font-size="10">• Mutations (checkout/swap/portal) are billing-admin only — enforced at gateway PermissionGuard AND auth-service authorize() (defense-in-depth).</text>
  </g>
  <text x="620" y="1160" text-anchor="middle" fill="#fcd34d" font-size="10">Status: backend done (specs/08 + /billing/swap + specs/16 deferred downgrades). Live e2e pending sandbox account config + the client billing page.</text>
</svg>
