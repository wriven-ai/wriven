[project]
name = "ai-service"
version = "0.2.0"
description = "Wriven AI service for content generation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.4.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The service is deployed by copying source into the image, not by installing a
# wheel, so hatchling cannot infer a package from the project name (`ai_service`
# does not exist — the code lives in `app/`). Declaring it explicitly is what
# lets `uv run` build the project and therefore run the test suite.
[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
